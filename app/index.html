<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Nova Music</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b1a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#070b1a;--p:#101a36;--p2:#17244a;--ln:#243462;--tx:#f2f6ff;--mu:#93a4cc;--ac:#2f8cff;--hot:#7c5cff;--gold:#ffd166}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);overflow:hidden}
button,input,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:6px 8px;border-radius:10px}
input{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:11px 14px;width:100%;margin:4px 0}
#main{flex:1;overflow:auto;padding:16px 16px 24px;max-width:900px;width:100%;margin:0 auto}
h1{font-size:26px;margin-bottom:10px}h2{font-size:18px;margin:20px 0 10px}
.logo{background:linear-gradient(120deg,var(--ac),var(--hot));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.btn{background:linear-gradient(120deg,var(--ac),var(--hot));color:#fff;padding:9px 16px;border-radius:99px;font-weight:700}.btn.alt{background:var(--p2);border:1px solid var(--ln)}.btn.sm{padding:5px 10px;font-size:12px}
.hero{border-radius:20px;padding:22px;margin:10px 0 4px;background:linear-gradient(135deg,#2f8cff,#7c5cff 60%,#d946ef);box-shadow:0 10px 30px #7c5cff44}
.hero h1{margin:0 0 4px}.hero p{opacity:.9;margin-bottom:12px}.hero .btn{background:#fff;color:#1b1b4b}
.rowx{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.rowx::-webkit-scrollbar{display:none}
.c{flex:none;width:130px;cursor:pointer}.c img,.c .ph{width:130px;height:130px;border-radius:14px;object-fit:cover;background:linear-gradient(135deg,var(--ac),var(--hot));display:grid;place-items:center;font-size:36px}
.c .t,.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px;font-weight:600}.a{color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:10px;padding:7px;border-radius:12px}.row:hover,.row.on{background:var(--p)}.row.on .t{color:var(--ac)}.row .t{margin:0}
.art{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:linear-gradient(135deg,var(--ac),var(--hot));display:grid;place-items:center}
.m{flex:1;min-width:0;cursor:pointer;display:flex;gap:10px;align-items:center}.m>div{min-width:0}
.pill{font-size:10.5px;border:1px solid var(--ln);border-radius:99px;padding:1px 7px;color:var(--mu)}.on-l{color:var(--hot)!important}
.card{background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}.empty{color:var(--mu);padding:26px 8px;text-align:center}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}label{display:block;color:var(--mu);font-size:13px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 4px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:middle}
.gold{color:var(--gold)}.chip{display:inline-block;background:var(--p2);border:1px solid var(--ln);border-radius:99px;padding:6px 14px;margin:0 6px 6px 0;cursor:pointer}
#bar{background:var(--p);border-top:1px solid var(--ln);padding:8px 14px}
#now{display:flex;align-items:center;gap:10px}#now .m{cursor:pointer}#ctl{display:flex;justify-content:center;align-items:center;gap:4px}
#ctl button{font-size:20px}#play{background:#fff;width:42px;height:42px;border-radius:50%;color:#0a1030;padding:0}
.seek{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mu)}.seek input{flex:1;padding:0;border:0;accent-color:var(--hot)}
#bar.big{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;padding:30px;background:linear-gradient(180deg,#1b2a66,var(--bg));padding-top:calc(30px + env(safe-area-inset-top))}
#bar.big #now{flex-direction:column;text-align:center}#bar.big #cov{width:min(78vw,340px);height:min(78vw,340px);border-radius:22px;font-size:80px}#bar.big #cov img{width:100%;height:100%;border-radius:22px}#bar.big #tt{font-size:22px;font-weight:700}#bar.big #ctl{margin-top:10px}#bar.big #ctl button{font-size:26px}
nav{display:flex;background:#050814;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 2px;font-size:11px;color:var(--mu);border-radius:0}nav button i{display:block;font-style:normal;font-size:19px}nav button.on{color:var(--tx);box-shadow:inset 0 3px var(--hot)}
.brand{display:none}
@media(min-width:900px){body{display:grid;grid-template-columns:220px 1fr;grid-template-rows:1fr auto;grid-template-areas:"nav main" "bar bar"}#main{grid-area:main;max-width:none;margin:0;padding:24px 36px;background:linear-gradient(180deg,#14246a,var(--bg) 300px)}#bar{grid-area:bar}
nav{grid-area:nav;flex-direction:column;border:0;padding:18px 10px;gap:4px}nav button{flex:none;text-align:left;font-size:15px;padding:11px 14px}nav button i{display:inline;margin-right:10px}nav button.on{box-shadow:none;background:var(--p)}.brand{display:block;font-size:20px;padding:6px 14px 18px}}
#auth{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 30% 10%,var(--c1,#2b3f9e),var(--bg) 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto}.alogo{width:92px;height:92px;border-radius:24px;object-fit:cover;box-shadow:0 8px 30px #0008;margin-bottom:8px}.eq{display:flex;gap:5px;align-items:flex-end;height:60px;margin-top:26px}.eq i{width:7px;border-radius:4px;background:linear-gradient(var(--ac),var(--hot));height:12px;animation:eq 1s ease-in-out infinite}@keyframes eq{50%{height:56px}}@media(prefers-reduced-motion:reduce){.eq i{animation:none}}#auth .card{width:min(400px,100%);padding:22px}
</style></head><body>
<div id="main"></div>
<div id="bar"><div id="now"><div class="art" id="cov">♪</div><div class="m" id="np"><div><div class="t" id="tt">Nothing playing</div><div class="a" id="ta">Pick a song to start</div></div></div><button id="lk">♡</button></div>
<div class="seek"><span id="cur">0:00</span><input type="range" id="sk" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
<div id="ctl"><button id="sh">⇄</button><button id="pv">⏮</button><button id="play">▶</button><button id="nx">⏭</button><button id="rp">↻</button><input type="range" id="vol" min="0" max="100" value="80" style="width:70px;padding:0;border:0;accent-color:var(--ac)"></div></div>
<nav id="nav"></nav><div id="auth" hidden></div>
<input type="file" id="lf" accept="image/*" hidden><input type="file" id="fi" accept="audio/*" multiple hidden><audio id="au" preload="auto"></audio>
<script>
const $=s=>document.querySelector(s),au=$('#au'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const ADMIN='admin@gmail.com',B='https://api.audius.co/v1',DAY=864e5;
const S={lib:{},users:ls('users',{}),me:ls('session',null),logo:ls('logo',''),name:ls('name','Nova Music'),tag:ls('tag','Your music, everywhere'),c1:ls('c1','#2b3f9e'),q:[],i:-1,view:'home',sh:false,rp:0,res:null,cache:{},home:null,mode:'login'};
const isAdm=()=>S.me==ADMIN,U=()=>S.users[S.me]||{},K=k=>k+':'+S.me;
const prem=()=>isAdm()||(U().prem||0)>Date.now(),days=u=>Math.max(0,Math.ceil(((u.prem||0)-Date.now())/DAY));
const likes=()=>ls(K('likes'),[]),pls=()=>ls(K('pls'),{}),plays=()=>ls(K('plays'),{});
const H=async x=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('nova:'+x)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch{return btoa('nova:'+x)}};
const brandH=()=>(S.logo?`<img src="${S.logo}" style="height:30px;width:30px;border-radius:8px;vertical-align:middle;margin-right:8px">`:'')+`<span class="logo">${esc(S.name)}</span>`;
const dbp=new Promise(r=>{const q=indexedDB.open('nova',1);q.onupgradeneeded=()=>q.result.createObjectStore('t',{keyPath:'id'});q.onsuccess=()=>r(q.result)});
const tx=async(m,f)=>{const d=await dbp;return new Promise((ok,no)=>{const q=f(d.transaction('t',m).objectStore('t'));q.onsuccess=()=>ok(q.result);q.onerror=no})};
const put=t=>tx('readwrite',s=>s.put(t)),all=()=>tx('readonly',s=>s.getAll()),del=id=>tx('readwrite',s=>s.delete(id));
const T=id=>S.cache[id]||S.lib[id],remember=t=>(S.cache[t.id]=t,t);
async function save(t){if(!S.lib[t.id]){const{blob,...m}=t;S.lib[t.id]=m;await put(m)}}
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const J=u=>fetch(u).then(r=>r.json());
// ---------- search with relevance ranking ----------
const norm=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\u0900-\u097f ]/g,' ').replace(/\s+/g,' ').trim();
const skel=w=>w.replace(/[aeiouyh]/g,'').replace(/(.)\1+/g,'$1');
function score(t,q){const nq=norm(q),tt=norm(t.title),ta=norm(t.artist),tk=nq.split(' ').filter(Boolean);let s=0;
 if(tt==nq)s+=200;else if(tt.startsWith(nq))s+=120;else if(tt.includes(nq))s+=90;
 const tw=tt.split(' '),aw=ta.split(' '),hit=[];
 for(const w of tk){if(tw.includes(w))s+=30;else if(tt.includes(w))s+=18;else if(tw.some(x=>skel(x)&&skel(x)==skel(w)))s+=14;else if(aw.includes(w)||ta.includes(w))s+=8;else continue;hit.push(w)}
 if(tk.length&&hit.length==tk.length)s+=60;s+={Audius:6,iTunes:4,'Internet Archive':0}[t.from]||0;s+=Math.min(10,Math.log10((t.pop||0)+1)*2);
 return hit.length?s:0}
async function searchOnline(q){const out=[];
 const A=J(`${B}/tracks/search?limit=30&app_name=NovaMusic&query=${encodeURIComponent(q)}`).then(j=>(j.data||[]).forEach(t=>out.push(trk(t)))).catch(()=>{});
 const I=J('https://itunes.apple.com/search?media=music&limit=25&term='+encodeURIComponent(q)).then(j=>(j.results||[]).forEach(d=>d.previewUrl&&out.push({id:'it'+d.trackId,title:d.trackName,artist:d.artistName,art:(d.artworkUrl100||'').replace('100x100','300x300'),src:d.previewUrl,from:'iTunes',pop:0,note:'30s preview'}))).catch(()=>{});
 const R=J('https://archive.org/advancedsearch.php?output=json&rows=20&sort[]=downloads+desc&fl[]=identifier&fl[]=title&fl[]=creator&q='+encodeURIComponent('title:('+q+') AND mediatype:audio')).then(j=>(j.response?.docs||[]).forEach(d=>out.push({id:'ia'+d.identifier,title:d.title,artist:[].concat(d.creator||'Internet Archive')[0],ia:d.identifier,from:'Internet Archive',pop:0}))).catch(()=>{});
 await Promise.all([A,I,R]);const seen=new Set();
 return out.map(t=>({t,s:score(t,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.t).filter(t=>{const k=norm(t.title+t.artist);return seen.has(k)?0:seen.add(k)})}
const trk=t=>({id:'au'+t.id,title:t.title,artist:t.user?.name||'Audius',art:t.artwork?.['480x480']||t.artwork?.['150x150'],src:`${B}/tracks/${t.id}/stream?app_name=NovaMusic`,from:'Audius',pop:t.play_count||0});
async function resolve(t){if(t.src||!t.ia)return t.src;const j=await J('https://archive.org/metadata/'+t.ia);
 const f=(j.files||[]).find(f=>/\.mp3$/i.test(f.name))||(j.files||[]).find(f=>/\.(ogg|m4a|flac)$/i.test(f.name));if(!f)throw Error('No audio');return t.src=`https://archive.org/download/${t.ia}/${encodeURIComponent(f.name)}`}
// ---------- home data ----------
async function loadHome(){const g=['Electronic','Hip-Hop/Rap','Pop','Lo-Fi','Rock'];const o={trend:[],gen:{},pls:[]};
 await Promise.all([J(`${B}/tracks/trending?limit=20&app_name=NovaMusic`).then(j=>o.trend=(j.data||[]).map(t=>remember(trk(t)))).catch(()=>{}),
  J(`${B}/playlists/trending?limit=10&app_name=NovaMusic`).then(j=>o.pls=(j.data||[]).map(p=>({id:p.id,name:p.playlist_name,art:p.artwork?.['480x480']||p.artwork?.['150x150'],by:p.user?.name}))).catch(()=>{}),
  ...g.map(x=>J(`${B}/tracks/trending?limit=12&genre=${encodeURIComponent(x)}&app_name=NovaMusic`).then(j=>o.gen[x]=(j.data||[]).map(t=>remember(trk(t)))).catch(()=>{}))]);
 S.home=o;if(S.view=='home')render(true)}
// ---------- player ----------
async function playAt(i){S.i=i;const id=S.q[i],t=T(id);if(!t)return next();$('#tt').textContent=t.title;$('#ta').textContent=t.artist+(t.note?' · '+t.note:'');setCov(t);syncLike();
 const p=plays();p[id]=(p[id]||0)+1;sv(K('plays'),p);const rc=ls(K('recent'),[]).filter(x=>x!=id);rc.unshift(id);sv(K('recent'),rc.slice(0,30));
 try{const full=(await tx('readonly',s=>s.get(id)))||{};au.src=full.blob?URL.createObjectURL(full.blob):await resolve(t);await au.play()}catch{toast('Cannot play'+(navigator.onLine?'':' offline — download it first'))}
 if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,artwork:t.art?[{src:t.art}]:[]});navigator.mediaSession.setActionHandler('previoustrack',prev);navigator.mediaSession.setActionHandler('nexttrack',next)}}
const setCov=t=>$('#cov').innerHTML=t.art?`<img class="art" style="width:100%;height:100%" src="${esc(t.art)}">`:'♪';
const startList=(ids,i)=>{S.q=ids.slice();S.i=-1;playAt(i)};
function next(){if(!S.q.length)return;let i=S.sh?Math.floor(Math.random()*S.q.length):S.i+1;if(i>=S.q.length){if(S.rp==1)i=0;else return}playAt(i)}
function prev(){if(au.currentTime>3)au.currentTime=0;else playAt(Math.max(0,S.i-1))}
au.onended=()=>S.rp==2?(au.currentTime=0,au.play()):next();
au.ontimeupdate=()=>{$('#sk').value=au.duration?au.currentTime/au.duration*1000:0;$('#cur').textContent=fmt(au.currentTime);$('#dur').textContent=fmt(au.duration)};
au.onplay=()=>$('#play').textContent='⏸';au.onpause=()=>$('#play').textContent='▶';
$('#play').onclick=()=>au.src?(au.paused?au.play():au.pause()):0;$('#nx').onclick=next;$('#pv').onclick=prev;$('#np').onclick=()=>$('#bar').classList.toggle('big');
$('#sk').oninput=e=>au.duration&&(au.currentTime=e.target.value/1000*au.duration);$('#vol').oninput=e=>au.volume=e.target.value/100;
$('#sh').onclick=e=>{S.sh=!S.sh;e.currentTarget.classList.toggle('on-l',S.sh)};$('#rp').onclick=e=>{S.rp=(S.rp+1)%3;e.currentTarget.textContent=S.rp==2?'↺1':'↻';e.currentTarget.classList.toggle('on-l',S.rp>0)};
const cur=()=>S.q[S.i];function syncLike(){const l=likes().includes(cur());$('#lk').textContent=l?'♥':'♡';$('#lk').classList.toggle('on-l',l)}$('#lk').onclick=()=>cur()&&like(cur());
async function like(id){await save(T(id));const l=likes(),k=l.indexOf(id);k<0?l.push(id):l.splice(k,1);sv(K('likes'),l);syncLike();render(true)}
async function addToPl(id){const p=pls(),n=prompt('Add to which playlist?'+(Object.keys(p).length?'\nExisting: '+Object.keys(p).join(', '):'')+'\nType a name (new name creates a playlist):');if(!n)return;await save(T(id));(p[n]=p[n]||[]);if(!p[n].includes(id))p[n].push(id);sv(K('pls'),p);toast('Added to '+n)}
async function download(id){if(!prem()){toast('Offline downloads need Premium. Ask the admin to activate Premium for you.');return}const t=T(id);if(t.from=='iTunes'||t.src){}
 toast('Downloading…');try{const r=await fetch(await resolve(t));if(!r.ok)throw 0;const blob=await r.blob();S.lib[id]={...t,dl:1};await put({...S.lib[id],blob});toast('Saved for offline');render(true)}catch{toast('Download failed (source blocks it or no connection)')}}
async function removeTrack(id){await del(id);delete S.lib[id];sv(K('likes'),likes().filter(x=>x!=id));const p=pls();for(const k in p)p[k]=p[k].filter(x=>x!=id);sv(K('pls'),p);render(true)}
function toast(m){const d=$('#toast')||Object.assign(document.body.appendChild(document.createElement('div')),{id:'toast'});d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:170px;background:#000d;border:1px solid var(--ln);padding:9px 16px;border-radius:99px;z-index:99;max-width:90%;text-align:center';d.textContent=m;d.hidden=false;clearTimeout(d.t);d.t=setTimeout(()=>d.hidden=true,3200)}
// ---------- views ----------
let lists=[];const L=ids=>lists.push(ids)-1;
const cardH=(t,l,i)=>`<div class="c" data-play="${i}" data-l="${l}">${t.art?`<img src="${esc(t.art)}" loading="lazy" alt="">`:'<div class="ph">♪</div>'}<div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist)}</div></div>`;
const rail=(ts)=>{ts=ts.filter(Boolean);const l=L(ts.map(t=>t.id));return ts.length?`<div class="rowx">${ts.map((t,i)=>cardH(t,l,i)).join('')}</div>`:''};
const rowH=(t,l,i,rm)=>{const lk=likes().includes(t.id);return`<div class="row ${cur()==t.id?'on':''}"><div class="m" data-play="${i}" data-l="${l}">${t.art?`<img class="art" src="${esc(t.art)}" loading="lazy" alt="">`:'<div class="art">♪</div>'}<div><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist)} · ${t.from||''} ${t.note?`<span class="pill">${t.note}</span>`:''} ${S.lib[t.id]?.dl?'<span class="pill">offline</span>':''}</div></div></div><button data-like="${esc(t.id)}" class="${lk?'on-l':''}">${lk?'♥':'♡'}</button><button data-pl="${esc(t.id)}">＋</button><button data-dl="${esc(t.id)}">⬇</button>${rm?`<button data-rm="${esc(t.id)}">✕</button>`:''}</div>`};
const list=(ids,rm)=>{ids=ids.filter(T);const l=L(ids);return ids.map((id,i)=>rowH(T(id),l,i,rm)).join('')};
const NAV=[['home','⌂','Home'],['search','⌕','Search'],['lib','♫','Library'],['pl','☰','Playlists'],['me','☺','Profile']];
function render(keep){if(!S.me){return authUI()}$('#auth').hidden=true;lists=[];const m=$('#main'),y=m.scrollTop;const nav=NAV.concat(isAdm()?[['admin','⚙','Admin']]:[]);
 $('#nav').innerHTML=`<div class="brand">${brandH()}</div>`+nav.map(([v,i,n])=>`<button data-v="${v}" class="${S.view==v?'on':''}"><i>${i}</i>${n}</button>`).join('');
 let h='';const libIds=Object.keys(S.lib);
 if(S.view=='home'){const hm=S.home;const top=Object.entries(plays()).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).filter(T).slice(0,12),rc=ls(K('recent'),[]).filter(T).slice(0,12);
  h=`<div class="hero"><h1>Hi ${esc((U().name||S.me).split(/[ @]/)[0])} 👋</h1><p>${prem()?'Premium active'+(isAdm()?'':' · '+days(U())+' days left'):'Free plan'} · Millions of free tracks</p><button class="btn" id="hplay">▶ Play trending</button></div>`
  +(navigator.onLine?'':'<p class="empty">You are offline. Open Library for downloaded songs.</p>')
  +(!hm?'<p class="empty">Loading songs…</p>':`${hm.trend.length?`<h2>🔥 Trending now</h2>${rail(hm.trend)}`:''}${top.length?`<h2>⭐ Your top played</h2>${rail(top.map(T))}`:''}${rc.length?`<h2>🕘 Recently played</h2>${rail(rc.map(T))}`:''}${hm.pls.length?`<h2>Featured playlists</h2><div class="rowx">${hm.pls.map(p=>`<div class="c" data-aupl="${p.id}">${p.art?`<img src="${esc(p.art)}" loading="lazy">`:'<div class="ph">☰</div>'}<div class="t">${esc(p.name)}</div><div class="a">${esc(p.by||'')}</div></div>`).join('')}</div>`:''}${Object.entries(hm.gen).map(([g,ts])=>ts.length?`<h2>${esc(g)}</h2>${rail(ts)}`:'').join('')}`)}
 if(S.view=='search'){h=`<h1>Search</h1><input type="search" id="q" placeholder="Song or artist e.g. 265 haseen" value="${esc(S.qs||'')}">${S.res===null?'<p class="empty">Best matches always appear first.</p>':S.res==='...'?'<p class="empty">Searching…</p>':S.res.length?list(S.res.map(t=>remember(t).id)):'<p class="empty">No matches. Try another spelling.</p>'}`}
 if(S.view=='lib'){h=`<h1>Library</h1><div class="tools"><button class="btn" id="add">Add songs from device</button><button class="btn alt" id="likedPlay">Play liked</button></div><h2>Liked songs</h2>${list(likes())||'<p class="empty">Tap ♡ on a song.</p>'}<h2>Offline & saved</h2>${list(libIds,1)||'<p class="empty">Nothing saved yet.</p>'}`}
 if(S.view=='pl'){const p=pls(),ns=Object.keys(p);h=`<h1>Playlists</h1><div class="tools"><button class="btn" id="newpl">New playlist</button></div>${ns.map(n=>`<div class="card"><b>${esc(n)}</b> <span class="pill">${p[n].length} songs</span><div class="tools"><button class="btn alt sm" data-plplay="${esc(n)}">▶ Play</button><button class="btn alt sm" data-pldl="${esc(n)}">⬇ Offline</button><button class="btn alt sm" data-pldel="${esc(n)}">Delete</button></div>${list(p[n])}</div>`).join('')||'<p class="empty">Create a playlist, then press ＋ on any song.</p>'}`}
 if(S.view=='me'){const u=U();h=`<h1>Profile</h1><div class="card"><b>${esc(u.name||S.me)}</b><div class="a">${esc(S.me)}</div><p style="margin-top:10px" class="${prem()?'gold':''}"><b>${isAdm()?'Admin · Premium forever':prem()?'Premium · '+days(u)+' days left':'Free plan'}</b></p><p class="a" style="margin:6px 0">Premium unlocks offline downloads. The admin activates Premium for your account.</p><button class="btn alt" id="logout">Log out</button></div>`}
 if(S.view=='admin'&&isAdm()){const us=Object.entries(S.users),pc=us.filter(([,u])=>(u.prem||0)>Date.now()).length;
  h=`<h1>Admin panel</h1><div class="card"><b>${us.length}</b> users · <b class="gold">${pc}</b> premium · ${Object.keys(S.lib).length} saved songs</div><div class="card"><b>Users</b><div style="overflow-x:auto"><table><tr><th>User</th><th>Joined</th><th>Premium</th><th>Actions</th></tr>${us.map(([e,u])=>`<tr><td>${esc(u.name||'')}<div class="a">${esc(e)}</div></td><td>${new Date(u.created).toLocaleDateString()}</td><td class="${days(u)?'gold':''}">${days(u)?days(u)+' days':'Free'}</td><td><button class="btn alt sm" data-pd="${esc(e)}|7">+7d</button> <button class="btn alt sm" data-pd="${esc(e)}|30">+30d</button> <button class="btn alt sm" data-pd="${esc(e)}|365">+1y</button> <button class="btn alt sm" data-pc="${esc(e)}">Custom</button> <button class="btn alt sm" data-pd="${esc(e)}|0">Revoke</button> <button class="btn alt sm" data-ud="${esc(e)}">Delete</button></td></tr>`).join('')||'<tr><td colspan=4 class="empty">No users yet</td></tr>'}</table></div></div>
  <div class="card"><b>Logo & name</b><div class="tools"><button class="btn alt" id="alogo">Upload logo</button><button class="btn alt" id="alogoRm">Remove logo</button></div><label>App name</label><input type="text" id="an" value="${esc(S.name)}"><button class="btn" id="aname" style="margin-top:8px">Save name</button></div>
  <div class="card"><b>Login page</b><p class="a">The logo above is also shown on the login page.</p><label>Tagline</label><input type="text" id="atag" value="${esc(S.tag)}"><label>Background colour</label><input type="color" id="ac1" value="${S.c1}" style="height:44px;padding:4px"><button class="btn" id="alog2" style="margin-top:8px">Save login page</button></div>
  <div class="card"><b>Change admin password</b><label>Current</label><input type="password" id="o"><label>New (4+ chars)</label><input type="password" id="n"><button class="btn" id="apw" style="margin-top:8px">Change</button></div>`}
 $('#bar').style.display='';m.innerHTML=h;m.scrollTop=keep?y:0}
function authUI(){const a=$('#auth'),lg=S.mode=='login';a.hidden=false;a.style.setProperty('--c1',S.c1);a.innerHTML=`<div style="text-align:center"><img class="alogo" src="${S.logo||'icon-192.png'}" alt=""><h1 style="margin:0"><span class="logo">${esc(S.name)}</span></h1><p class="a" style="margin:4px 0 14px">${esc(S.tag)}</p></div><div class="card" style="margin-top:0"><p class="a" style="text-align:center;margin-bottom:6px">${lg?'Log in to continue':'Create your account'}</p>${lg?'':'<input id="rn" placeholder="Your name" autocomplete="name">'}<input id="re" type="email" placeholder="Email (e.g. you@gmail.com)" autocomplete="username"><input id="rp2" type="password" placeholder="Password" autocomplete="${lg?'current-password':'new-password'}"><button class="btn" id="${lg?'doLogin':'doReg'}" style="width:100%;margin-top:10px;padding:12px">${lg?'Log in':'Register'}</button><p style="text-align:center;margin-top:12px"><a href="#" id="swap" style="color:var(--ac)">${lg?'New here? Register':'Have an account? Log in'}</a></p></div><div class="eq" aria-hidden="true"><i style="animation-delay:0.00s;animation-duration:0.70s"></i><i style="animation-delay:0.11s;animation-duration:0.85s"></i><i style="animation-delay:0.22s;animation-duration:1.00s"></i><i style="animation-delay:0.33s;animation-duration:1.15s"></i><i style="animation-delay:0.44s;animation-duration:1.30s"></i><i style="animation-delay:0.55s;animation-duration:0.70s"></i><i style="animation-delay:0.66s;animation-duration:0.85s"></i><i style="animation-delay:0.77s;animation-duration:1.00s"></i><i style="animation-delay:0.88s;animation-duration:1.15s"></i><i style="animation-delay:0.99s;animation-duration:1.30s"></i><i style="animation-delay:0.10s;animation-duration:0.70s"></i><i style="animation-delay:0.21s;animation-duration:0.85s"></i><i style="animation-delay:0.32s;animation-duration:1.00s"></i><i style="animation-delay:0.43s;animation-duration:1.15s"></i><i style="animation-delay:0.54s;animation-duration:1.30s"></i><i style="animation-delay:0.65s;animation-duration:0.70s"></i><i style="animation-delay:0.76s;animation-duration:0.85s"></i><i style="animation-delay:0.87s;animation-duration:1.00s"></i></div>`}
const login=e=>{S.me=e;sv('session',e);S.view='home';render();if(!S.home)loadHome()};
// ---------- events ----------
document.body.onclick=async e=>{const sw=e.target.closest('#swap');if(sw){e.preventDefault();S.mode=S.mode=='login'?'reg':'login';return authUI()}
 const b=e.target.closest('button,[data-play],[data-aupl]');if(!b)return;const d=b.dataset,id=b.id;
 if(id=='doLogin'){const em=$('#re').value.trim().toLowerCase(),pw=$('#rp2').value;const hp=await H(pw);
   if(em==ADMIN){const ah=ls('apw',null);if(ah?hp==ah:pw=='admin'){if(!S.users[ADMIN]){S.users[ADMIN]={name:'Admin',created:Date.now()};sv('users',S.users)}login(ADMIN)}else toast('Wrong email or password')}
   else if(S.users[em]&&S.users[em].h==hp)login(em);else toast('Wrong email or password')}
 else if(id=='doReg'){const em=$('#re').value.trim().toLowerCase(),pw=$('#rp2').value,nm=$('#rn').value.trim();
   if(!/^\S+@\S+\.\S+$/.test(em))return toast('Enter a valid email');if(em==ADMIN)return toast('This email is reserved');if(pw.length<4)return toast('Password: 4+ characters');if(S.users[em])return toast('Already registered — log in');
   S.users[em]={name:nm||em.split('@')[0],h:await H(pw),created:Date.now(),prem:0};sv('users',S.users);login(em)}
 else if(id=='logout'){S.me=null;sv('session',null);au.pause();S.mode='login';render()}
 else if(d.v){S.view=d.v;render()}else if(d.play!==undefined)startList(lists[+d.l],+d.play);
 else if(d.aupl){toast('Loading playlist…');try{const j=await J(`${B}/playlists/${d.aupl}/tracks?app_name=NovaMusic`);const ts=(j.data||[]).map(t=>remember(trk(t)).id);ts.length?startList(ts,0):toast('Empty playlist')}catch{toast('Could not load playlist')}}
 else if(id=='hplay'){const t=S.home?.trend||[];t.length?startList(t.map(x=>x.id),0):toast('Still loading…')}
 else if(d.like)like(d.like);else if(d.pl)addToPl(d.pl);else if(d.dl)download(d.dl);else if(d.rm)removeTrack(d.rm);
 else if(d.plplay){const l=pls()[d.plplay];l.length&&startList(l,0)}else if(d.pldl){for(const i of pls()[d.pldl])await download(i)}
 else if(d.pldel){const p=pls();delete p[d.pldel];sv(K('pls'),p);render(true)}
 else if(id=='add')$('#fi').click();else if(id=='likedPlay'){const l=likes();l.length&&startList(l,0)}
 else if(id=='newpl'){const n=prompt('Playlist name'),p=pls();if(n&&!p[n]){p[n]=[];sv(K('pls'),p);render(true)}}
 else if(isAdm()&&d.pd){const[em,n]=d.pd.split('|'),u=S.users[em];u.prem=+n?Math.max(u.prem||0,Date.now())+n*DAY:0;sv('users',S.users);render(true)}
 else if(isAdm()&&d.pc){const n=+prompt('How many premium days?','30');if(n>0){const u=S.users[d.pc];u.prem=Math.max(u.prem||0,Date.now())+n*DAY;sv('users',S.users);render(true)}}
 else if(isAdm()&&d.ud){if(d.ud!=ADMIN&&confirm('Delete user '+d.ud+'?')){delete S.users[d.ud];sv('users',S.users);render(true)}}
 else if(id=='alogo')$('#lf').click();else if(id=='alogoRm'){S.logo='';sv('logo','');render(true)}
 else if(id=='alog2'){S.tag=$('#atag').value.trim();S.c1=$('#ac1').value;sv('tag',S.tag);sv('c1',S.c1);toast('Login page saved')}
 else if(id=='aname'){S.name=$('#an').value.trim()||'Nova Music';sv('name',S.name);document.title=S.name;render(true);toast('Saved')}
 else if(id=='apw'){const ah=ls('apw',null),ok=ah?(await H($('#o').value))==ah:$('#o').value=='admin',n=$('#n').value;if(!ok)toast('Current password wrong');else if(n.length<4)toast('Too short');else{sv('apw',await H(n));toast('Password changed')}}};
$('#lf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),q=Math.min(im.width,im.height);x.drawImage(im,(im.width-q)/2,(im.height-q)/2,q,q,0,0,256,256);S.logo=c.toDataURL('image/png');sv('logo',S.logo);render(true)};im.src=URL.createObjectURL(f);e.target.value=''};
document.addEventListener('keydown',async e=>{if(e.target.id=='q'&&e.key=='Enter'){S.qs=e.target.value.trim();if(!S.qs)return;S.res='...';render(true);$('#q').focus();S.res=await searchOnline(S.qs);render(true)}
 if((e.target.id=='re'||e.target.id=='rp2')&&e.key=='Enter')$('#doLogin,#doReg').click()});
$('#fi').onchange=async e=>{for(const f of e.target.files){const id='lo'+f.name+f.size,t={id,title:f.name.replace(/\.[^.]+$/,''),artist:'This device',from:'Local'};S.lib[id]=t;await put({...t,blob:f,dl:1});S.lib[id].dl=1}e.target.value='';render(true)};
addEventListener('online',()=>{loadHome();render(true)});addEventListener('offline',()=>render(true));
(async()=>{(await all()).forEach(t=>{const{blob,...m}=t;S.lib[t.id]=m});if(S.me&&!S.users[S.me]&&S.me!=ADMIN)S.me=null;render();if(S.me)loadHome();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
